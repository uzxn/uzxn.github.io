<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        line-height: 2;
      }
      hr {
        margin: 8px 0;
      }
      button {
        padding: 4px 8px;
      }
      textarea {
        width: 100%;
        margin: 4px 0;
        resize: none;
      }
    </style>
    <title>User Agent</title>
  </head>

  <body>
    <h3>User Agent</h3>
    <hr />
    <p>当前浏览器 UA</p>
    <textarea readonly id="ua" rows="5"></textarea>
    <button onclick="copy()">复制到剪贴板</button>
    <script>
      const ua = navigator.userAgent;
      document.getElementById("ua").textContent = ua;
      function copy() {
        navigator.clipboard.writeText(ua);
      }
    </script>
  </body>
</html>
