<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="normalize.min.css" />
    <style>
      body {
        max-width: 50rem;
        margin: 0 auto;
        padding: 1rem;
      }
    </style>
    <title>User Agent</title>
  </head>

  <body>
    <h3>当前浏览器 UA</h3>
    <hr />
    <p><code id="ua"></code></p>
    <p><button onclick="copy()">复制到剪贴板</button></p>
    <script>
      document.getElementById("ua").textContent = navigator.userAgent;
      const copy = () => navigator.clipboard.writeText(navigator.userAgent);
    </script>
  </body>
</html>
