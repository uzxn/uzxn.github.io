<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/downloadjs/download.min.js"></script>
    <title>Z-Order 图片混淆工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        line-height: 2;
      }
      hr {
        margin: 8px 0;
      }
      input,
      button {
        margin-bottom: 8px;
      }
      button {
        padding: 8px;
      }
      canvas {
        max-width: 100%;
        max-height: 400px;
        border: 1px solid #999;
        margin-bottom: 8px;
      }
      .infoDiv {
        margin-bottom: 8px;
      }
      .infoSpan {
        border: 1px solid #999;
        padding: 6px;
      }
    </style>
  </head>

  <body>
    <h3>Z-Order 图片混淆工具</h3>
    <p>一种基于 Z-Order 和 Morton 码的图片混淆方式</p>
    <hr />
    <input type="file" id="upload" accept="image/*" />
    <br />
    <button id="confuse">混淆</button>
    <button id="restore">还原</button>
    <button id="downloadPNG">下载 PNG</button>
    <button id="downloadJPG">下载 JPG</button>
    <div class="infoDiv">
      <span class="infoSpan" id="info">未选择文件</span>
    </div>
    <canvas id="canvas"></canvas>

    <script>
      "use strict";
      const infoSpan = document.getElementById("info");
      const upload = document.getElementById("upload");
      const confuseBtn = document.getElementById("confuse");
      const restoreBtn = document.getElementById("restore");
      const downloadPNGBtn = document.getElementById("downloadPNG");
      const downloadJPGBtn = document.getElementById("downloadJPG");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      let w = 0,
        h = 0,
        fwd = [],
        rev = [],
        order = [];

      function get_zorder(x, y, deg, xmax, ymax) {
        /*
        if (deg == 0) {
          if (x < xmax && y < ymax) {
            order.push(x * ymax + y);
            if (order.length > xmax + ymax) fwd[order[order.length - 1 - xmax - ymax]] = order[order.length - 1];
            if (order.length > xmax * ymax - xmax - ymax) fwd[order[order.length - 1]] = order[order.length - 1 + xmax + ymax - xmax * ymax];
          }
          return;
        }
        deg -= 1;
        get_zorder(x, y, deg, xmax, ymax);
        get_zorder(x, y + (1 << deg), deg, xmax, ymax);
        get_zorder(x + (1 << deg), y, deg, xmax, ymax);
        get_zorder(x + (1 << deg), y + (1 << deg), deg, xmax, ymax);
        */
        const stack = [[x, y, deg]];
        while (stack.length) {
          const [cx, cy, cdeg] = stack.pop();
          if (cdeg === 0) {
            if (cx < xmax && cy < ymax) {
              order.push(cx * ymax + cy);
              if (order.length > xmax + ymax) fwd[order[order.length - 1 - xmax - ymax]] = order[order.length - 1];
              if (order.length > xmax * ymax - xmax - ymax) fwd[order[order.length - 1]] = order[order.length - 1 + xmax + ymax - xmax * ymax];
            }
          } else {
            const ndeg = cdeg - 1;
            const step = 1 << ndeg;
            stack.push([cx + step, cy + step, ndeg]);
            stack.push([cx + step, cy, ndeg]);
            stack.push([cx, cy + step, ndeg]);
            stack.push([cx, cy, ndeg]);
          }
        }
      }

      // 构建映射表 (Z-Order + 循环偏移)
      function buildMaps(width, height) {
        console.log("buildMaps");
        ((fwd = []), (rev = []), (order = []));
        const deg = Math.ceil(Math.max(Math.log2(width), Math.log2(height)));
        get_zorder(0, 0, deg, height, width);
        for (let i = 0; i < width * height; i++) rev[fwd[i]] = i;
      }

      // 像素重映射
      function remap(map) {
        const total = w * h;
        const src = ctx.getImageData(0, 0, w, h).data;
        const dst = new Uint8ClampedArray(total * 4);
        for (let i = 0; i < total; i++) {
          dst[map[i] * 4] = src[i * 4];
          dst[map[i] * 4 + 1] = src[i * 4 + 1];
          dst[map[i] * 4 + 2] = src[i * 4 + 2];
          dst[map[i] * 4 + 3] = src[i * 4 + 3];
        }
        ctx.putImageData(new ImageData(dst, w, h), 0, 0);
      }

      // 加载图片
      let currentUrl = null;
      function loadImage(file) {
        if (!file || !file.type.startsWith("image/")) {
          infoSpan.innerHTML = "未选择文件";
          return;
        }
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        infoSpan.innerHTML = "加载中...";
        const img = new Image();
        const url = URL.createObjectURL(file);
        currentUrl = url;
        img.onload = () => {
          w = img.width;
          h = img.height;
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0);
          buildMaps(w, h);
          URL.revokeObjectURL(url);
          currentUrl = null;
          infoSpan.innerHTML = "加载完成";
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          currentUrl = null;
          w = h = 0;
          canvas.width = canvas.height = 0;
          infoSpan.innerHTML = "加载失败";
        };
        img.src = url;
      }

      function downloadCanvasPNG() {
        if (!w || !h) {
          infoSpan.innerHTML = "没有可下载的图片";
          return;
        }
        const filename = `zorder_${w}x${h}_${Date.now()}.png`;
        canvas.toBlob((blob) => {
          if (blob) download(blob, filename, "image/png");
          else infoSpan.innerHTML = "下载图片失败";
        }, "image/png");
      }

      function downloadCanvasJPG() {
        if (!w || !h) {
          infoSpan.innerHTML = "没有可下载的图片";
          return;
        }
        const filename = `zorder_${w}x${h}_${Date.now()}.jpg`;
        canvas.toBlob((blob) => {
          if (blob) download(blob, filename, "image/jpeg");
          else infoSpan.innerHTML = "下载图片失败";
        }, "image/jpeg");
      }

      upload.addEventListener("change", (e) => loadImage(e.target.files[0]));
      confuseBtn.addEventListener("click", () => remap(fwd));
      restoreBtn.addEventListener("click", () => remap(rev));
      downloadPNGBtn.addEventListener("click", downloadCanvasPNG);
      downloadJPGBtn.addEventListener("click", downloadCanvasJPG);
    </script>
  </body>
</html>
