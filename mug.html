<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音游杂项</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        line-height: 2;
      }
      hr {
        margin: 8px 0;
      }
      input,
      button {
        margin: 4px 0;
        padding: 8px;
      }
      button {
        width: 60px;
      }
    </style>
  </head>
  <body>
    <h3>音游杂项</h3>
    <hr />
    <p>Malody ACC 计算</p>
    <input type="text" id="best" placeholder="输入 Best 个数" />
    <input type="text" id="cool" placeholder="输入 Cool 个数" />
    <input type="text" id="good" placeholder="输入 Good 个数" />
    <input type="text" id="miss" placeholder="输入 Miss 个数" />
    <br />
    <button onclick="calcMalodyACC()">确定</button>
    <div id="malody-acc"></div>
    <hr />
    <p>Phigros 单曲 rks 计算</p>
    <input type="text" id="lv" placeholder="输入定数，例如 15.9" />
    <input type="text" id="acc" placeholder="输入 ACC，例如 99.66" />
    <br />
    <button onclick="calcPhigrosRKS()">确定</button>
    <div id="phigros-rks"></div>
    <script>
      function calcPhigrosRKS() {
        let res = 0;
        const lv = Number(document.getElementById("lv").value);
        const acc = Number(document.getElementById("acc").value);
        if (acc >= 70) res = Math.pow((acc - 55) / 45, 2) * lv;
        res = "单曲 rks：" + res.toFixed(4);
        document.getElementById("phigros-rks").innerHTML = res;
      }
      function calcMalodyACC() {
        const best = Number(document.getElementById("best").value);
        const cool = Number(document.getElementById("cool").value);
        const good = Number(document.getElementById("good").value);
        const miss = Number(document.getElementById("miss").value);
        let res = (best * 100 + cool * 75 + good * 40) / (best + cool + good + miss);
        res = "ACC：" + res.toFixed(4) + "%";
        document.getElementById("malody-acc").innerHTML = res;
      }
    </script>
  </body>
</html>
