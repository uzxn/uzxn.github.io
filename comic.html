<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JM Reader</title>
  <link id="bsCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    onerror="this.onerror=null;this.href='https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css'" />
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    #reader {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #0a0a0b;
      -webkit-overflow-scrolling: touch;
    }

    #pages {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .page {
      width: 100%;
      aspect-ratio: 1 / 1;
      /* 占位方块：高 = 宽 */
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4f58;
      font-size: 12px;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
    }

    body.view-page #pages {
      display: none;
    }

    body.view-page #reader {
      overflow: hidden;
    }

    #single {
      display: none;
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 100%;
      margin: 0 auto;
      align-items: center;
      justify-content: center;
    }

    body.view-page #single {
      display: flex;
    }

    #single img {
      max-width: 100%;
      max-height: 100%;
    }

    #singleMsg {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      color: #9aa3b2;
      font-size: 12px;
      pointer-events: none;
    }

    #pageInfo {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary-subtle py-2">
    <div class="container-fluid">
      <span class="navbar-brand mb-0">JM Reader</span>
    </div>
  </nav>

  <div class="container-fluid py-2 border-bottom border-secondary-subtle">
    <form id="loadForm" class="row g-2 align-items-center">
      <div class="col">
        <input id="aid" class="form-control" type="text" inputmode="numeric" autocomplete="off"
          placeholder="作品 ID，例如 1224005" />
      </div>
      <div class="col-auto">
        <select id="hostSelect" class="form-select w-auto" aria-label="图片分流">
          <option value="https://cdn-msp3.jmapiproxy1.cc/media/photos/">cdn-msp3.jmapiproxy1.cc</option>
          <option value="https://cdn-msp2.jmapiproxy1.cc/media/photos/">cdn-msp2.jmapiproxy1.cc</option>
          <option value="https://cdn-msp.jmapiproxy3.cc/media/photos/">cdn-msp.jmapiproxy3.cc</option>
          <option value="https://cdn-msp.jmapiproxy1.cc/media/photos/">cdn-msp.jmapiproxy1.cc</option>
          <option value="https://cdn-msp2.jmdanjonproxy.vip/media/photos/">cdn-msp2.jmdanjonproxy.vip</option>
          <option value="https://cdn-msp12.jmdanjonproxy.xyz/media/photos/">cdn-msp12.jmdanjonproxy.xyz</option>
          <option value="https://cdn-msp3.jmapiproxy3.cc/media/photos/">cdn-msp3.jmapiproxy3.cc</option>
        </select>
      </div>
      <div class="col-auto">
        <select id="viewSelect" class="form-select w-auto" aria-label="视图模式">
          <option value="scroll">连续滚动</option>
          <option value="page">单页</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">阅读</button>
      </div>
    </form>
  </div>

  <main id="reader">
    <div id="pages"></div>
    <div id="single">
      <img id="singleImg" alt="" />
      <div id="singleMsg"></div>
    </div>
  </main>

  <footer class="bg-dark border-top border-secondary-subtle py-2">
    <div class="container-fluid d-flex align-items-center justify-content-center gap-3">
      <button id="prevBtn" class="btn btn-outline-light btn-sm d-none" type="button">上一页</button>
      <span id="pageInfo" class="text-secondary small" aria-live="polite">- / -</span>
      <button id="nextBtn" class="btn btn-outline-light btn-sm d-none" type="button">下一页</button>
    </div>
  </footer>

  <script>
    /* ================= MD5（切片数与 API token） ================= */
    function md5(str) {
      const bytes = [];
      for (let i = 0; i < str.length; i++) {
        let c = str.charCodeAt(i);
        if (c < 0x80) bytes.push(c);
        else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
        else if (c < 0xd800 || c >= 0xe000)
          bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        else {
          i++;
          c = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
          bytes.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
      }
      const bitLen = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      for (let i = 0; i < 8; i++) bytes.push(i < 4 ? (bitLen >>> (8 * i)) & 0xff : 0);

      const K = new Array(64);
      const S = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21];
      for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;

      let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
      for (let off = 0; off < bytes.length; off += 64) {
        const M = new Array(16);
        for (let i = 0; i < 16; i++) {
          M[i] = (bytes[off + i * 4] | (bytes[off + i * 4 + 1] << 8) | (bytes[off + i * 4 + 2] << 16) | (bytes[off + i * 4 + 3] << 24)) >>> 0;
        }
        let A = a0, B = b0, C = c0, D = d0;
        for (let i = 0; i < 64; i++) {
          let F, g;
          if (i < 16) { F = (B & C) | (~B & D); g = i; }
          else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
          else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
          else { F = C ^ (B | ~D); g = (7 * i) % 16; }
          F = (F + A + K[i] + M[g]) >>> 0;
          A = D; D = C; C = B;
          const rot = ((F << S[i]) | (F >>> (32 - S[i]))) >>> 0;
          B = (B + rot) >>> 0;
        }
        a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
      }
      const hx = (n) => {
        let s = "";
        for (let i = 0; i < 4; i++) s += ((n >>> (i * 8)) & 0xff).toString(16).padStart(2, "0");
        return s;
      };
      return hx(a0) + hx(b0) + hx(c0) + hx(d0);
    }

    /* ================= AES-256 ECB 解密（/chapter 的 data） ================= */
    const AES = (() => {
      const sbox = new Uint8Array(256);
      const invSbox = new Uint8Array(256);

      function gmul(a, b) {
        let p = 0;
        for (let i = 0; i < 8; i++) {
          if (b & 1) p ^= a;
          const hi = a & 0x80;
          a = (a << 1) & 0xff;
          if (hi) a ^= 0x1b;
          b >>= 1;
        }
        return p;
      }

      function rotl8(x, n) {
        return ((x << n) | (x >>> (8 - n))) & 0xff;
      }

      for (let i = 0; i < 256; i++) {
        let inv = 0;
        if (i !== 0) {
          inv = 1;
          let base = i;
          let e = 254;
          while (e) {
            if (e & 1) inv = gmul(inv, base);
            base = gmul(base, base);
            e >>= 1;
          }
        }
        const s = (inv ^ rotl8(inv, 1) ^ rotl8(inv, 2) ^ rotl8(inv, 3) ^ rotl8(inv, 4) ^ 0x63) & 0xff;
        sbox[i] = s;
        invSbox[s] = i;
      }

      function expandKey(key) {
        const Nk = 8;
        const Nr = 14;
        const w = [];
        for (let i = 0; i < Nk; i++) w.push(Array.from(key.slice(i * 4, i * 4 + 4)));
        let rcon = 1;
        for (let i = Nk; i < 4 * (Nr + 1); i++) {
          let t = w[i - 1].slice();
          if (i % Nk === 0) {
            t = [t[1], t[2], t[3], t[0]];
            t = t.map((b) => sbox[b]);
            t[0] ^= rcon;
            rcon = gmul(rcon, 2);
          } else if (i % Nk === 4) {
            t = t.map((b) => sbox[b]);
          }
          w.push(w[i - Nk].map((b, j) => b ^ t[j]));
        }
        return { w, Nr };
      }

      function addRoundKey(st, w, round) {
        for (let c = 0; c < 4; c++) {
          for (let r = 0; r < 4; r++) st[r + 4 * c] ^= w[round * 4 + c][r];
        }
      }

      function invShiftRows(st) {
        for (let r = 1; r < 4; r++) {
          const row = [st[r], st[r + 4], st[r + 8], st[r + 12]];
          for (let c = 0; c < 4; c++) st[r + 4 * ((c + r) % 4)] = row[c];
        }
      }

      function invMixColumns(st) {
        for (let c = 0; c < 4; c++) {
          const i = 4 * c;
          const a0 = st[i], a1 = st[i + 1], a2 = st[i + 2], a3 = st[i + 3];
          st[i] = gmul(a0, 14) ^ gmul(a1, 11) ^ gmul(a2, 13) ^ gmul(a3, 9);
          st[i + 1] = gmul(a0, 9) ^ gmul(a1, 14) ^ gmul(a2, 11) ^ gmul(a3, 13);
          st[i + 2] = gmul(a0, 13) ^ gmul(a1, 9) ^ gmul(a2, 14) ^ gmul(a3, 11);
          st[i + 3] = gmul(a0, 11) ^ gmul(a1, 13) ^ gmul(a2, 9) ^ gmul(a3, 14);
        }
      }

      function decryptBlock(block, ks) {
        const st = Array.from(block);
        addRoundKey(st, ks.w, ks.Nr);
        for (let round = ks.Nr - 1; round >= 1; round--) {
          invShiftRows(st);
          for (let i = 0; i < 16; i++) st[i] = invSbox[st[i]];
          addRoundKey(st, ks.w, round);
          invMixColumns(st);
        }
        invShiftRows(st);
        for (let i = 0; i < 16; i++) st[i] = invSbox[st[i]];
        addRoundKey(st, ks.w, 0);
        return st;
      }

      return {
        decryptEcb(bytes, key) {
          const ks = expandKey(key);
          const out = new Uint8Array(bytes.length);
          for (let off = 0; off < bytes.length; off += 16) {
            const dec = decryptBlock(bytes.subarray(off, off + 16), ks);
            out.set(dec, off);
          }
          const pad = out[out.length - 1];
          if (pad >= 1 && pad <= 16) return out.subarray(0, out.length - pad);
          return out;
        },
      };
    })();

    /* ================= 切片数 ================= */
    function getNum(aid, filename) {
      if (aid < 220980) return 0;
      if (aid < 268850) return 10;
      const x = aid < 421926 ? 10 : 8;
      const digest = md5(String(aid) + filename);
      return (digest.charCodeAt(31) % x) * 2 + 2;
    }

    /* ================= 切片倒序还原 ================= */
    function decodeToCanvas(img, num) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!num || num < 2 || h < num * 4) return null;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      const over = h % num;
      for (let i = 0; i < num; i++) {
        let move = Math.floor(h / num);
        const ySrc = h - move * (i + 1) - over;
        let yDst = move * i;
        if (i === 0) move += over;
        else yDst += over;
        if (ySrc < 0 || yDst < 0 || move <= 0) return null;
        ctx.drawImage(img, 0, ySrc, w, move, 0, yDst, w, move);
      }
      return canvas;
    }

    /* ================= 官方 API：完整图片列表 ================= */
    const API_HOSTS = [
      "https://www.cdnbtd.cc",
      "https://www.cdnutc.cc",
      "https://www.cdngwc.net",
      "https://www.cdngwc.club",
    ];
    const API_TOKEN_SECRET = "185Hcomic3PAPP7R";
    const API_VERSION = "2.1.13";
    let apiHost = null;

    async function fetchChapterImages(aid) {
      let lastError = null;
      const hosts = apiHost ? [apiHost, ...API_HOSTS.filter((h) => h !== apiHost)] : API_HOSTS;
      for (const host of hosts) {
        try {
          const ts = Math.floor(Date.now() / 1000);
          const token = md5(String(ts) + API_TOKEN_SECRET);
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          try {
            const res = await fetch(host + "/chapter?id=" + aid + "&v=" + ts, {
              signal: controller.signal,
              headers: { token, tokenparam: ts + "," + API_VERSION },
            });
            if (!res.ok) throw new Error("API HTTP " + res.status);
            const json = await res.json();
            if (!json || json.code !== 200 || typeof json.data !== "string") throw new Error("API 数据异常");
            const bin = Uint8Array.from(atob(json.data), (c) => c.charCodeAt(0));
            const key = new TextEncoder().encode(md5(String(ts) + API_TOKEN_SECRET));
            const plain = AES.decryptEcb(bin, key);
            const obj = JSON.parse(new TextDecoder().decode(plain));
            if (!Array.isArray(obj.images) || !obj.images.length) throw new Error("images 为空");
            apiHost = host;
            return obj.images;
          } finally {
            clearTimeout(timer);
          }
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error("API 不可用");
    }

    /* ================= 元素 & 状态 ================= */
    const $ = (id) => document.getElementById(id);
    const reader = $("reader");
    const pagesEl = $("pages");
    const pageInfo = $("pageInfo");
    const aidInput = $("aid");
    const hostSelect = $("hostSelect");
    const viewSelect = $("viewSelect");
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const singleImg = $("singleImg");
    const singleMsg = $("singleMsg");

    const state = {
      aid: 0,
      images: null,
      mode: "scroll",
      blocks: [],
      imageCache: new Map(), // page -> { url, w, h, revoke }
      imageLoading: new Map(), // page -> Promise
      observer: null,
      cur: 0,
      seq: 0,
      singleSeq: 0,
    };

    const pad5 = (n) => String(n).padStart(5, "0");
    const pageName = (p) => (state.images && state.images[p - 1]) || pad5(p) + ".webp";

    const loadImage = (url) =>
      new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(url));
        img.src = url;
      });

    const canvasToUrl = (canvas) =>
      new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) reject(new Error("toBlob failed"));
          else resolve(URL.createObjectURL(blob));
        }, "image/png");
      });

    function setPageInfo(cur, total) {
      pageInfo.textContent = (cur || "-") + " / " + (total || "?");
    }

    function updateFooter() {
      const isPage = state.mode === "page";
      const total = state.images ? state.images.length : 0;
      prevBtn.classList.toggle("d-none", !isPage);
      nextBtn.classList.toggle("d-none", !isPage);
      prevBtn.disabled = !isPage || state.cur <= 1;
      nextBtn.disabled = !isPage || !total || state.cur >= total;
    }

    function applyMode() {
      document.body.classList.toggle("view-page", state.mode === "page");
      updateFooter();
    }

    function clearAll() {
      state.singleSeq++;
      if (state.observer) {
        state.observer.disconnect();
        state.observer = null;
      }
      // 先移除 DOM，再释放 blob，避免画面瞬间变空
      pagesEl.replaceChildren();
      singleImg.removeAttribute("src");
      singleMsg.textContent = "";
      for (const item of state.imageCache.values()) {
        if (item.revoke) URL.revokeObjectURL(item.url);
      }
      state.imageCache.clear();
      state.imageLoading.clear();
      state.blocks = [];
      state.images = null;
      state.cur = 0;
      setPageInfo(0, 0);
      updateFooter();
    }

    async function getPageImage(page) {
      if (state.imageCache.has(page)) return state.imageCache.get(page);
      if (state.imageLoading.has(page)) return state.imageLoading.get(page);

      const aid = state.aid;
      const name = pageName(page);
      const base = name.replace(/\.[^.]+$/, "");
      const promise = (async () => {
        const img = await loadImage(hostSelect.value + aid + "/" + name);
        const canvas = decodeToCanvas(img, getNum(aid, base));

        let url, w, h, revoke = false;
        if (canvas) {
          url = await canvasToUrl(canvas);
          revoke = true;
          w = canvas.width;
          h = canvas.height;
        } else {
          url = img.src;
          w = img.naturalWidth;
          h = img.naturalHeight;
        }

        if (aid !== state.aid) {
          if (revoke) URL.revokeObjectURL(url);
          throw new Error("stale");
        }

        const item = { url, w, h, revoke };
        state.imageCache.set(page, item);
        return item;
      })();

      state.imageLoading.set(page, promise);
      try {
        return await promise;
      } finally {
        if (state.imageLoading.get(page) === promise) state.imageLoading.delete(page);
      }
    }

    async function loadPage(page, block) {
      if (block.dataset.loading === "1" || block.querySelector("img")) return;
      block.dataset.loading = "1";
      if (block.dataset.failed === "1") {
        block.dataset.failed = "";
        block.textContent = "";
      }
      try {
        const item = await getPageImage(page);
        if (!block.isConnected) return;
        const el = document.createElement("img");
        el.src = item.url;
        el.alt = "第 " + page + " 页";
        block.style.aspectRatio = item.w + " / " + item.h;
        block.replaceChildren(el);
        schedulePageUpdate();
      } catch (e) {
        if (block.isConnected) {
          block.dataset.failed = "1";
          block.textContent = "加载失败";
        }
      } finally {
        delete block.dataset.loading;
      }
    }

    async function showSingle(page) {
      if (!state.images) return;
      const total = state.images.length;
      if (page < 1 || page > total) return;
      state.cur = page;
      setPageInfo(page, total);
      updateFooter();
      const seq = ++state.singleSeq;
      singleMsg.textContent = "加载中…";
      try {
        const item = await getPageImage(page);
        if (seq !== state.singleSeq || state.mode !== "page" || state.cur !== page) return;
        singleImg.src = item.url;
        singleImg.alt = "第 " + page + " 页";
        singleMsg.textContent = "";
      } catch (e) {
        if (seq !== state.singleSeq) return;
        singleImg.removeAttribute("src");
        singleMsg.textContent = "加载失败，可切换图片分流重试";
      }
    }

    function scrollToPage(page) {
      const block = state.blocks[page - 1];
      if (!block) return;
      const top = block.getBoundingClientRect().top - reader.getBoundingClientRect().top + reader.scrollTop;
      reader.scrollTop = Math.max(0, top);
    }

    function onIntersect(entries) {
      if (state.mode !== "scroll") return;
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const page = Number(entry.target.dataset.page);
        loadPage(page, entry.target);
      }
    }

    let pageRaf = 0;

    function schedulePageUpdate() {
      if (pageRaf) return;
      pageRaf = requestAnimationFrame(() => {
        pageRaf = 0;
        updateCurrentPage();
      });
    }

    // 可见面积最大的页面作为当前页
    function updateCurrentPage() {
      if (state.mode !== "scroll" || !state.blocks.length || !state.images) return;
      const r = reader.getBoundingClientRect();
      let best = 0;
      let bestArea = 0;
      for (const block of state.blocks) {
        const b = block.getBoundingClientRect();
        const top = Math.max(b.top, r.top);
        const bottom = Math.min(b.bottom, r.bottom);
        const area = Math.max(0, bottom - top) * b.width;
        if (area > bestArea) {
          bestArea = area;
          best = Number(block.dataset.page);
        }
      }
      if (best > 0) {
        state.cur = best;
        setPageInfo(best, state.images.length);
        updateFooter();
      }
    }

    async function start() {
      const text = String(aidInput.value || "").trim();
      const m = text.match(/\/photos\/(\d+)/i) || text.match(/^(\d+)$/) || text.match(/(\d{2,})/);
      if (!m) {
        aidInput.focus();
        return;
      }
      const aid = parseInt(m[1], 10);
      const seq = ++state.seq;
      state.mode = viewSelect.value;

      clearAll();
      state.aid = aid;
      setPageInfo(0, 0);
      pageInfo.textContent = "加载中…";

      let images;
      try {
        images = await fetchChapterImages(aid);
      } catch (e) {
        if (seq !== state.seq) return;
        pagesEl.innerHTML = '<div class="alert alert-danger m-3">获取页数失败，请检查网络或稍后重试。</div>';
        singleMsg.textContent = "获取页数失败";
        setPageInfo(0, 0);
        applyMode();
        return;
      }
      if (seq !== state.seq) return;

      state.images = images;
      const total = images.length;

      const blocks = [];
      for (let p = 1; p <= total; p++) {
        const block = document.createElement("div");
        block.className = "page";
        block.dataset.page = String(p);
        blocks.push(block);
        pagesEl.appendChild(block);
      }
      state.blocks = blocks;

      state.observer = new IntersectionObserver(onIntersect, {
        root: reader,
        rootMargin: "100% 0px",
        threshold: [0, 0.01, 0.25, 0.5, 0.75, 1],
      });
      for (const block of blocks) state.observer.observe(block);

      state.cur = 1;
      applyMode();
      if (state.mode === "page") {
        showSingle(1);
      } else {
        reader.scrollTop = 0;
        setPageInfo(1, total);
        schedulePageUpdate();
      }
      updateFooter();
    }

    $("loadForm").addEventListener("submit", (e) => {
      e.preventDefault();
      start();
    });

    // 视图切换：连续滚动 / 单页
    viewSelect.addEventListener("change", () => {
      state.mode = viewSelect.value;
      if (!state.images) {
        applyMode();
        return;
      }
      applyMode();
      if (state.mode === "page") {
        showSingle(state.cur || 1);
      } else {
        state.singleSeq++;
        const cur = state.cur || 1;
        requestAnimationFrame(() => {
          scrollToPage(cur);
          if (state.images) {
            const from = Math.max(1, cur - 1);
            const to = Math.min(state.images.length, cur + 1);
            for (let p = from; p <= to; p++) loadPage(p, state.blocks[p - 1]);
          }
          schedulePageUpdate();
        });
      }
    });

    prevBtn.addEventListener("click", () => {
      if (state.mode === "page") showSingle(state.cur - 1);
    });
    nextBtn.addEventListener("click", () => {
      if (state.mode === "page") showSingle(state.cur + 1);
    });

    reader.addEventListener("scroll", schedulePageUpdate, { passive: true });

    // 切换图片分流：已加载的页面保留，失败的页面重试
    hostSelect.addEventListener("change", () => {
      for (const block of state.blocks) {
        if (block.dataset.failed === "1") loadPage(Number(block.dataset.page), block);
      }
      if (state.mode === "page" && state.cur) showSingle(state.cur);
    });
  </script>
</body>

</html>
