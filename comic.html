<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComicReader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        line-height: 2;
      }
      hr {
        margin: 8px 0;
      }
      input,
      button {
        margin: 4px 0;
        padding: 8px;
      }
      img {
        width: 100%;
        margin: 8px 0;
        border: 1px solid #ccc;
      }
    </style>
  </head>

  <body>
    <h3>ComicReader</h3>
    <p>使用键盘左右键快速翻页</p>
    <hr />
    <input id="id" placeholder="请输入漫画 ID" />
    <button id="loadBtn">开始阅读</button>
    <br />
    <button id="prevBtn">上一页</button>
    <span id="page">-</span>
    <button id="nextBtn">下一页</button>
    <div id="imgDiv"></div>

    <script>
      var idInput = document.getElementById("id");
      var loadBtn = document.getElementById("loadBtn");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var pageSpan = document.getElementById("page");
      var imgDiv = document.getElementById("imgDiv");

      var base = "",
        cache = [],
        cur = 0,
        max = 0;

      function make_url(p) {
        return base + ("0000" + p).slice(-5) + ".webp";
      }

      function load() {
        var id = idInput.value.trim();
        if (!id) {
          alert("漫画 ID 不可为空！");
          return;
        }
        base = "https://cdn-msp3.jm18c-kimi.net/media/photos/" + id + "/";
        cache = [];
        cur = 1;
        max = 0;
        show(cur);
        updateUI();
      }

      function updateUI() {
        pageSpan.innerText = cur;
        prevBtn.disabled = cur <= 1;
        nextBtn.disabled = max && cur >= max;
      }

      function show(page) {
        if (cache[page]) {
          imgDiv.innerHTML = "";
          imgDiv.appendChild(cache[page]);
          return;
        }
        imgDiv.innerHTML = "加载中...";
        console.log(make_url(page));
        var img = new Image();
        img.src = make_url(page);
        img.onload = function () {
          cache[page] = img;
          updateUI();
        };
        img.onerror = function () {
          max = page - 1;
          imgDiv.innerHTML = "加载失败";
          updateUI();
        };
        imgDiv.innerHTML = "";
        imgDiv.appendChild(img);
      }

      function prev() {
        if (cur > 1) {
          cur -= 1;
          show(cur);
          updateUI();
        }
      }

      function next() {
        if (!max || cur < max) {
          cur += 1;
          show(cur);
          updateUI();
        }
      }

      loadBtn.onclick = load;
      prevBtn.onclick = prev;
      nextBtn.onclick = next;
      idInput.onkeydown = function (e) {
        if (e.key === "Enter") load();
      };
      window.onkeydown = function (e) {
        if (e.key === "ArrowLeft") prev();
        else if (e.key === "ArrowRight") next();
      };
    </script>
  </body>
</html>
