<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JM Reader</title>
  <link id="bsCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    onerror="this.onerror=null;this.href='https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css'" />
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    #reader {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #0a0a0b;
      cursor: pointer;
    }

    #stage {
      overflow: auto;
    }

    #stage img,
    #stage canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }

    #pageInfo {
      font-variant-numeric: tabular-nums;
    }

    #loading {
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary-subtle py-2">
    <div class="container-fluid">
      <span class="navbar-brand mb-0">JM Reader</span>
    </div>
  </nav>

  <div class="container-fluid py-2 border-bottom border-secondary-subtle">
    <form id="loadForm" class="row g-2 align-items-center">
      <div class="col">
        <input id="aid" class="form-control" type="text" inputmode="numeric" autocomplete="off"
          placeholder="作品 ID，例如 1224005" />
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">阅读</button>
      </div>
    </form>
  </div>

  <div id="reader">
    <div id="stage" class="w-100 h-100 d-flex align-items-center justify-content-center">
      <div class="text-secondary text-center px-4">
        输入作品 ID 后点「阅读」<br />
        左右方向键或点击左右两侧翻页
      </div>
    </div>

    <div id="loading" class="position-absolute top-50 start-50 translate-middle d-none">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  </div>

  <footer class="bg-dark border-top border-secondary-subtle py-2">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <button id="prevBtn" class="btn btn-outline-light btn-sm" type="button" disabled>上一页</button>
      <span id="pageInfo" class="text-secondary small">- / -</span>
      <button id="nextBtn" class="btn btn-outline-light btn-sm" type="button" disabled>下一页</button>
    </div>
  </footer>

  <script>
    const HOST = "https://cdn-msp3.jm18c-kimi.net/media/photos/";

    /* ================= MD5（只用于算切片数） ================= */
    function md5(str) {
      const bytes = [];
      for (let i = 0; i < str.length; i++) {
        let c = str.charCodeAt(i);
        if (c < 0x80) bytes.push(c);
        else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
        else if (c < 0xd800 || c >= 0xe000)
          bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        else {
          i++;
          c = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
          bytes.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
      }
      const bitLen = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      for (let i = 0; i < 8; i++) bytes.push(i < 4 ? (bitLen >>> (8 * i)) & 0xff : 0);

      const K = new Array(64);
      const S = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21];
      for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;

      let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
      for (let off = 0; off < bytes.length; off += 64) {
        const M = new Array(16);
        for (let i = 0; i < 16; i++) {
          M[i] = (bytes[off + i * 4] | (bytes[off + i * 4 + 1] << 8) | (bytes[off + i * 4 + 2] << 16) | (bytes[off + i * 4 + 3] << 24)) >>> 0;
        }
        let A = a0, B = b0, C = c0, D = d0;
        for (let i = 0; i < 64; i++) {
          let F, g;
          if (i < 16) { F = (B & C) | (~B & D); g = i; }
          else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
          else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
          else { F = C ^ (B | ~D); g = (7 * i) % 16; }
          F = (F + A + K[i] + M[g]) >>> 0;
          A = D; D = C; C = B;
          const rot = ((F << S[i]) | (F >>> (32 - S[i]))) >>> 0;
          B = (B + rot) >>> 0;
        }
        a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
      }
      const hx = (n) => {
        let s = "";
        for (let i = 0; i < 4; i++) s += ((n >>> (i * 8)) & 0xff).toString(16).padStart(2, "0");
        return s;
      };
      return hx(a0) + hx(b0) + hx(c0) + hx(d0);
    }

    /* ================= 切片数 ================= */
    function getNum(aid, filename) {
      if (aid < 268850) return 10;
      const x = aid < 421926 ? 10 : 8;
      const digest = md5(String(aid) + filename);
      return (digest.charCodeAt(31) % x) * 2 + 2;
    }

    /* ================= 切片倒序还原 ================= */
    function decodeToCanvas(img, num) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!num || num < 2 || h < num * 4) return null;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      const over = h % num;
      for (let i = 0; i < num; i++) {
        let move = Math.floor(h / num);
        const ySrc = h - move * (i + 1) - over;
        let yDst = move * i;
        if (i === 0) move += over;
        else yDst += over;
        if (ySrc < 0 || yDst < 0 || move <= 0) return null;
        ctx.drawImage(img, 0, ySrc, w, move, 0, yDst, w, move);
      }
      return canvas;
    }

    /* ================= 元素 ================= */
    const $ = (id) => document.getElementById(id);
    const stage = $("stage");
    const reader = $("reader");
    const loading = $("loading");
    const pageInfo = $("pageInfo");
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const aidInput = $("aid");

    const state = {
      aid: 0,
      cur: 0,
      max: 0,
      cache: new Map(),
      seq: 0,
    };

    const pad5 = (n) => String(n).padStart(5, "0");
    const pageUrl = (p, aid = state.aid) => HOST + aid + "/" + pad5(p) + ".webp";

    function setStage(node) {
      stage.replaceChildren();
      if (typeof node === "string") stage.innerHTML = node;
      else if (node) stage.appendChild(node);
    }

    function setLoading(on) {
      loading.classList.toggle("d-none", !on);
    }

    function updateBar() {
      pageInfo.textContent = (state.cur || "-") + " / " + (state.max || "?");
      prevBtn.disabled = state.cur <= 1;
      nextBtn.disabled = !state.cur || (state.max > 0 && state.cur >= state.max);
    }

    const loadImage = (url) =>
      new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(url));
        img.src = url;
      });

    async function getPage(page) {
      const aid = state.aid;
      const key = aid + ":" + page;
      if (state.cache.has(key)) return state.cache.get(key);
      const img = await loadImage(pageUrl(page, aid));
      const canvas = decodeToCanvas(img, getNum(aid, pad5(page)));
      const item = { el: canvas || img };
      state.cache.set(key, item);
      return item;
    }

    async function show(page) {
      const seq = ++state.seq;
      setLoading(true);
      try {
        const item = await getPage(page);
        if (seq !== state.seq || page !== state.cur) return;
        setStage(item.el);
        updateBar();
        if (state.max === 0 || page < state.max) getPage(page + 1).catch(() => { });
      } catch (e) {
        if (seq !== state.seq) return;
        if (page === 1) {
          setStage('<div class="alert alert-danger m-3">第 1 页加载失败，请检查 ID。</div>');
          state.cur = 1;
          state.max = 1;
        } else {
          state.max = page - 1;
          state.cur = state.max;
          const cached = state.cache.get(state.aid + ":" + state.cur);
          if (cached) setStage(cached.el);
          else setStage('<div class="alert alert-danger m-3">没有可显示的页面。</div>');
        }
        updateBar();
      } finally {
        if (seq === state.seq) setLoading(false);
      }
    }

    function gotoPage(page) {
      if (!state.aid || page < 1) return;
      if (state.max && page > state.max) return;
      state.cur = page;
      updateBar();
      show(page);
    }

    function parseInput(raw) {
      const text = String(raw || "").trim();
      if (!text) return 0;
      const inUrl = text.match(/\/photos\/(\d+)/i);
      if (inUrl) return parseInt(inUrl[1], 10);
      if (/^\d+$/.test(text)) return parseInt(text, 10);
      const digits = text.match(/(\d{2,})/);
      return digits ? parseInt(digits[1], 10) : 0;
    }

    function start() {
      const aid = parseInput(aidInput.value);
      if (!aid) {
        aidInput.focus();
        return;
      }
      state.aid = aid;
      state.cur = 0;
      state.max = 0;
      state.cache.clear();
      state.seq++;
      gotoPage(1);
    }

    $("loadForm").addEventListener("submit", (e) => {
      e.preventDefault();
      start();
    });

    prevBtn.addEventListener("click", () => gotoPage(state.cur - 1));
    nextBtn.addEventListener("click", () => gotoPage(state.cur + 1));

    reader.addEventListener("click", (e) => {
      if (!state.aid || e.target.closest(".alert")) return;
      const rect = reader.getBoundingClientRect();
      if (!rect.width) return;
      if (e.clientX - rect.left < rect.width / 2) gotoPage(state.cur - 1);
      else gotoPage(state.cur + 1);
    });

    document.addEventListener("keydown", (e) => {
      if (e.target instanceof HTMLInputElement) return;
      if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        gotoPage(state.cur - 1);
      } else if (e.key === "ArrowRight" || e.key === "PageDown") {
        e.preventDefault();
        gotoPage(state.cur + 1);
      }
    });

    updateBar();
  </script>
</body>

</html>
